
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: technoassistant-backend

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    volumes:
      - qdrant_data:/app/qdrant_storage
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: technoassistant-frontend

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  qdrant_data:
  hf_cache:
